<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050705">
<meta name="robots" content="noindex">
<title>Signal lost — Tarun KM</title>
<link rel="icon" href="/assets/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #050705; --ink-2: #0c0f0c; --bone: #c9cec3; --smoke: #727472; --phosphor: #b4c4a4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink-2); color: var(--bone);
    font-family: "Inter Tight", Arial, sans-serif;
    display: grid; place-items: center; padding: 24px; text-align: center;
    background-image: repeating-linear-gradient(0deg, rgba(201,206,195,.035) 0 1px, transparent 1px 4px);
  }
  main { display: grid; gap: 28px; justify-items: center; }
  img { width: 88px; height: auto; opacity: .9; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--smoke); letter-spacing: 0; }
  h1 { font-size: clamp(56px, 14vw, 160px); line-height: .85; letter-spacing: -0.05em; font-weight: 500; }
  p { font-size: 18px; color: var(--smoke); }
  a {
    display: inline-flex; gap: 14px; align-items: center; padding: 14px 22px; border-radius: 999px;
    background: var(--bone); color: var(--ink); text-decoration: none; font-size: 15px; transition: background .3s;
  }
  a:hover { background: var(--phosphor); }
  .blink { display: inline-block; width: .55em; height: 1em; vertical-align: -.15em; background: var(--phosphor); animation: b 1s steps(2, start) infinite; }
  @keyframes b { to { visibility: hidden; } }
</style>
</head>
<body>
<main>
  <img src="/assets/logo.webp" alt="Tarun KM">
  <span class="mono">ERR.404 — signal lost</span>
  <h1 id="code">404</h1>
  <p>This frame doesn’t exist in the transmission.</p>
  <a href="/">Return to the signal <span>→</span></a>
  <span class="mono">&gt; reconnecting <span class="blink"></span></span>
</main>
<script>
  // "404" glitches through glyphs every few seconds
  const el = document.getElementById('code');
  const G = '!<>-_/[]{}=+*^?#%@&$01';
  const glitch = () => {
    let n = 0;
    const id = setInterval(() => {
      el.textContent = n++ < 8 ? [...'404'].map(() => G[(Math.random() * G.length) | 0]).join('') : '404';
      if (n > 8) clearInterval(id);
    }, 60);
  };
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(glitch, 3200);
</script>
</body>
</html>
